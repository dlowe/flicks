name: Test

# Client tests on every push — notably tests/offline.test.js, which guards the
# page working offline (a home-screen app on a phone with no data plan).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./test.sh
